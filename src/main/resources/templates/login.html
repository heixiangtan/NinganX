<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>柠安系统 | 核心管理后台</title>
    <style>
        body { background: #2c3e50; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: #34495e; padding: 40px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 350px; }
        h2 { text-align: center; margin-bottom: 30px; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; border: none; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #e74c3c; border: none; color: white; cursor: pointer; border-radius: 4px; }
        button:hover { background: #c0392b; }
        .warning { color: #f1c40f; font-size: 12px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>柠安系统 (V3.2)</h2>
    <form action="/admin/login" method="post">
        <input type="text" name="username" placeholder="管理员账号" required>
        <input type="password" name="password" placeholder="授权口令" required>
        <input type="hidden" name="fingerprint" id="fingerprint">
        <button type="submit">进入核心受控区</button>
    </form>
    <div class="warning">⚠️ 未经授权的访问将被记录 IP 并追究法律责任</div>
</div>

<script>
    (function() {
        const logicalW = window.screen.width;
        const logicalH = window.screen.height;
        const dpr = window.devicePixelRatio || 1; // 获取缩放倍率，默认为 1

        // 计算物理分辨率
        const physicalW = Math.round(logicalW * dpr);
        const physicalH = Math.round(logicalH * dpr);

        const userAgent = navigator.userAgent;

        // 拼接成完美的指纹字符串
        const info = `Physical:${physicalW}x${physicalH} | Logical:${logicalW}x${logicalH} | Zoom:${Math.round(dpr * 100)}% | Agent:${userAgent}`;

        document.getElementById('fingerprint').value = info;
    })();
</script>
</body>
</html>
