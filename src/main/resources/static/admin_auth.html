<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>柠安指挥部 | 核心鉴权中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');

        :root {
            --primary: #00f2ff;
            --primary-glow: rgba(0, 242, 255, 0.4);
            --bg: #030a10;
        }

        body {
            background: var(--bg);
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
        }

        #canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }

        .cyber-panel {
            background: rgba(4, 15, 24, 0.7);
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 242, 255, 0.05);
            backdrop-filter: blur(12px);
            position: relative;
        }

        .cyber-panel::before, .cyber-panel::after {
            content: ""; position: absolute; width: 20px; height: 20px; border: 2px solid var(--primary);
        }
        .cyber-panel::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
        .cyber-panel::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

        .glitch {
            position: relative;
            text-shadow: 0.05em 0 0 rgba(255,0,0,.75), -0.025em -0.05em 0 rgba(0,255,0,.75), 0.025em 0.05em 0 rgba(0,0,255,.75);
            animation: glitch 1.5s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 1px 0 0 red, -1px 0 0 blue; }
            14% { text-shadow: 1px 0 0 red, -1px 0 0 blue; }
            15% { text-shadow: -3px 0 0 red, 3px 0 0 blue; }
            99% { text-shadow: -1px 0 0 red, 1px 0 0 blue; }
            100% { text-shadow: 0 0 0 red, 0 0 0 blue; }
        }

        .cyber-input {
            background: rgba(0, 0, 0, 0.5) !important;
            border: 1px solid rgba(0, 242, 255, 0.2) !important;
            color: #fff !important;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cyber-input:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 15px var(--primary-glow) !important;
            transform: scale(1.02);
        }

        .cyber-button {
            background: linear-gradient(45deg, rgba(0, 242, 255, 0.1), transparent);
            border: 1px solid var(--primary);
            position: relative;
            overflow: hidden;
        }
        .cyber-button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 40px var(--primary-glow);
        }

        .scanline {
            width: 100%; height: 2px; background: rgba(0, 242, 255, 0.1);
            position: fixed; z-index: 10; top: 0; left: 0;
            animation: scan 4s linear infinite;
            pointer-events: none;
        }
        @keyframes scan { from { top: 0; } to { top: 100vh; } }
    </style>
</head>
<body class="flex items-center justify-center h-screen">

<canvas id="canvas"></canvas>
<div class="scanline"></div>

<div class="cyber-panel p-10 rounded-lg w-[26rem] z-20">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-cyan-500 shadow-[0_0_10px_#00f2ff]"></div>

    <div class="text-center mb-8">
        <div class="text-[10px] text-cyan-500 tracking-[0.3em] uppercase opacity-70 mb-2">Secure Command Interface</div>
        <h1 class="text-4xl font-black glitch tracking-widest text-white uppercase" style="font-style: normal;">柠安指挥部</h1>
        <div class="flex items-center justify-center gap-2 mt-2">
            <span class="h-[1px] w-8 bg-cyan-900"></span>
            <span class="text-[10px] text-cyan-600 italic">Auth Terminal v2.5</span>
            <span class="h-[1px] w-8 bg-cyan-900"></span>
        </div>
    </div>

    <div id="error-msg" class="hidden text-xs text-red-400 bg-red-950/20 border-l-4 border-red-500 p-3 mb-6 animate-pulse">
        <i class="fas fa-shield-virus mr-2"></i> ACCESS DENIED: INVALID CREDENTIALS
    </div>

    <form action="/do-admin-login" method="post" class="space-y-5">
        <div class="group relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-cyan-700 group-focus-within:text-cyan-400 transition-colors">
                <i class="fas fa-terminal"></i>
            </span>
            <input type="text" name="username" placeholder="通行码" required
                   class="w-full cyber-input pl-12 pr-4 py-4 text-xs rounded-none uppercase tracking-widest outline-none">
        </div>

        <div class="group relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-cyan-700 group-focus-within:text-cyan-400 transition-colors">
                <i class="fas fa-fingerprint"></i>
            </span>
            <input type="password" name="password" placeholder="校验码" required
                   class="w-full cyber-input pl-12 pr-4 py-4 text-xs rounded-none tracking-widest outline-none">
        </div>

        <div class="flex items-center justify-between text-[10px] text-cyan-700 uppercase tracking-tighter">
            <label class="flex items-center cursor-pointer hover:text-cyan-400">
                <input type="checkbox" name="remember-me" class="mr-2 opacity-30 accent-cyan-500">
                保持连接状态
            </label>
            <span class="opacity-50">Node: NingAn_Node_01</span>
        </div>

        <button type="submit" class="w-full cyber-button py-4 text-xs font-bold mt-4 flex items-center justify-center gap-3 transition-all">
            <span>执行身份解密</span>
            <i class="fas fa-angle-double-right"></i>
        </button>
    </form>

    <div class="mt-10 pt-6 border-t border-cyan-900/40 flex justify-between items-end">
        <div class="text-[9px] text-cyan-900 space-y-1">
            <p>ENCRYPTION: AES-256-GCM</p>
            <p>LOCATION: <span class="text-cyan-700">SHANGHAI_SERVER_CORE</span></p>
        </div>
        <div class="text-right">
            <div class="text-[9px] text-green-500/50 animate-pulse">● SYSTEM READY</div>
        </div>
    </div>
</div>

<script>
    // 动态 Matrix Canvas 脚本
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄ";
    const charArr = chars.split("");
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function draw() {
        ctx.fillStyle = "rgba(3, 10, 16, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00f2ff";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
            const text = charArr[Math.floor(Math.random() * charArr.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 33);

    // 错误处理
    window.onload = function() {
        if (new URLSearchParams(window.location.search).has('error')) {
            const errorBox = document.getElementById('error-msg');
            errorBox.classList.remove('hidden');
            errorBox.classList.add('flex');
        }
    }
</script>
</body>
</html>
